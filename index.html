<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘求職 | Mysterious Career</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="content">
            <h1 class="title">✨ 神秘求職 ✨</h1>
            <p class="subtitle">向宇宙提出你的問題</p>
            <p class="counter" id="counter">已有 <span id="countNumber">0</span> 人尋求宇宙的指引</p>

            <form id="fortuneForm">
                <div class="form-group">
                    <label for="name">你的姓名</label>
                    <input type="text" id="name" name="name" required placeholder="輸入你的姓名...">
                </div>

                <div class="form-group">
                    <label for="question">描述你夢想中的職業</label>
                    <textarea id="question" name="question" required placeholder="例如：我想成為軟體工程師，開發改變世界的應用程式..." rows="4"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>揭曉答案</span>
                </button>
                <p class="belief-text">只要心裡相信就會成就</p>
            </form>
        </div>
    </div>

    <!-- 彈出視窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 class="modal-title">🔮 宇宙的回應 🔮</h2>
            <div class="fortune-text" id="fortuneText"></div>
            <div class="divider"></div>
            <div class="links-section">
                <p class="links-intro">想要了解更多神秘知識？</p>
                <div class="links-container">
                    <a href="https://www.youtube.com/@LuluCatHome" target="_blank" class="social-link youtube">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                        訂閱我的頻道
                    </a>
                    <a href="https://ko-fi.com/newandnow" target="_blank" class="social-link donation">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        支持我的創作
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
